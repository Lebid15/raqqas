<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A5D">
<title>المفضلة — سوق الرقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
  <div class="section">
    <div class="result-count" id="count"></div>
    <div class="ads-grid" id="list"></div>

    <div class="empty hidden" id="empty">
      <div class="empty-icon">❤️</div>
      <div class="empty-title">لا توجد إعلانات محفوظة</div>
      <div class="empty-text">اضغط ❤️ على أي إعلان ليظهر هنا</div>
      <a class="btn btn-primary" href="index.html">تصفّح الإعلانات</a>
    </div>

    <div class="notice notice-info mt-16" id="tip">
      <span class="n-icon">🔔</span>
      <div>سنُعلمك إذا خفّض البائع سعر إعلان محفوظ لديك.</div>
    </div>
  </div>
</main>

<div id="nav"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  document.getElementById('header').innerHTML = mainHeader('favorites', {
    title: '❤️ المفضلة',
    back: true,
    actions: '<button class="btn btn-onbrand btn-sm" onclick="clearAll()">مسح الكل</button>'
  });
  document.getElementById('nav').innerHTML = bottomNav('account');

  function render() {
    let ids = Fav.all();
    // للتجربة: إن كانت المفضلة فارغة نعرض عيّنة
    let items = LISTINGS.filter(a => ids.includes(a.id));
    if (!ids.length) items = [LISTINGS[0], LISTINGS[3], LISTINGS[5]];

    document.getElementById('count').textContent = items.length + ' إعلان محفوظ';
    document.getElementById('list').innerHTML = items.map(adCard).join('');
    const isEmpty = items.length === 0;
    document.getElementById('empty').classList.toggle('hidden', !isEmpty);
    document.getElementById('tip').classList.toggle('hidden', isEmpty);
    document.getElementById('list').classList.toggle('hidden', isEmpty);
    bindFavs();
  }
  render();

  function clearAll() {
    localStorage.removeItem(Fav.key);
    document.getElementById('list').innerHTML = '';
    document.getElementById('count').textContent = '0 إعلان محفوظ';
    document.getElementById('empty').classList.remove('hidden');
    document.getElementById('tip').classList.add('hidden');
    toast('تم مسح المفضلة');
  }
</script>
</body>
</html>
