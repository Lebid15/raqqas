<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A5D">
<title>الرسائل — سوق الرقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
  <div class="section">
    <div class="tabs">
      <button class="tab is-active">الكل <span class="tab-count">5</span></button>
      <button class="tab">غير مقروءة <span class="tab-count">3</span></button>
      <button class="tab">كمشترٍ</button>
      <button class="tab">كبائع</button>
    </div>

    <div class="conv-list" id="convs"></div>

    <div class="notice notice-info mt-16">
      <span class="n-icon">🛡️</span>
      <div>لا تشارك بياناتك البنكية أو رموز التحقق مع أحد. تستطيع <b>حظر</b> أو <b>الإبلاغ عن</b> أي مستخدم من داخل المحادثة.</div>
    </div>
  </div>
</main>

<div id="nav"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  document.getElementById('header').innerHTML = mainHeader('messages');
  document.getElementById('nav').innerHTML = bottomNav('messages');

  document.getElementById('convs').innerHTML = CONVERSATIONS.map(c => `
    <a class="conv ${c.unread ? 'is-unread' : ''}" href="chat.html?id=${c.id}">
      <div class="conv-thumb"><img src="${c.img}" alt=""></div>
      <div class="conv-body">
        <div class="conv-top">
          <span class="conv-name">${c.name}</span>
          <span class="conv-time">${c.time}</span>
        </div>
        <div class="conv-ad">📦 ${c.listingTitle}</div>
        <div class="conv-last">${c.last}</div>
      </div>
      ${c.unread ? `<span class="conv-badge">${c.unread}</span>` : ''}
    </a>`).join('');
</script>
</body>
</html>
