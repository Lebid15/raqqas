<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A5D">
<title>الأقسام — سوق الرقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
  <div class="section">
    <div class="section-head">
      <h2 class="section-title">📂 كل الأقسام</h2>
      <span class="muted txt-sm">اضغط على القسم لعرض أقسامه الفرعية</span>
    </div>
    <div class="cat-list" id="list"></div>
  </div>

  <div class="section">
    <div class="notice notice-info">
      <span class="n-icon">ℹ️</span>
      <div>الأقسام والأقسام الفرعية تُدار بالكامل من <a href="admin.html" class="bold">لوحة التحكم</a> — تستطيع إضافة قسم أو تعديله أو إعادة ترتيبه بدون تعديل الكود.</div>
    </div>
  </div>
</main>

<div id="nav"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  document.getElementById('header').innerHTML = mainHeader('cats');
  document.getElementById('nav').innerHTML = bottomNav('cats');

  document.getElementById('list').innerHTML = CATEGORIES.map(c => `
    <div class="cat-row" data-row>
      <button class="cat-row-head">
        <span class="cat-emoji">${c.icon}</span>
        <span class="cat-row-info">
          <span class="cat-row-name">${c.name}</span>
          <span class="cat-row-sub">${c.count} إعلان · ${c.subs.length} أقسام فرعية</span>
        </span>
        <span class="cat-row-arrow">‹</span>
      </button>
      <div class="cat-subs">
        <a class="sub-chip" href="search.html?cat=${c.id}">الكل</a>
        ${c.subs.map(s => `<a class="sub-chip" href="search.html?cat=${c.id}&sub=${encodeURIComponent(s)}">${s}</a>`).join('')}
      </div>
    </div>`).join('');

  document.querySelectorAll('[data-row] .cat-row-head').forEach(h =>
    h.addEventListener('click', () => h.parentElement.classList.toggle('is-open')));
</script>
</body>
</html>
